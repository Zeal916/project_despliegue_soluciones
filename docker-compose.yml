# docker compose up -d mlflow      -> MLflow en http://localhost:5000
# docker compose up -d dashboard   -> tablero en http://localhost:8501
#   Sin API_URL el tablero predice con el paquete del modelo; con la API lista:
#   API_URL=http://IP_DE_LA_API:8000 docker compose up -d dashboard
# api queda en el perfil "app" hasta que exista su código
x-base: &base
  build: { context: ., dockerfile: docker/Dockerfile }
  volumes: [ "./data:/app/data" ]

services:
  mlflow:
    <<: *base
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts --allowed-hosts "*"
    ports: [ "5000:5000" ]
    volumes: [ "./mlflow_data:/mlflow" ]

  api:
    <<: *base
    profiles: [ app ]
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    environment: { MLFLOW_TRACKING_URI: "http://mlflow:5000" }
    ports: [ "8000:8000" ]
    depends_on: [ mlflow ]

  dashboard:
    build: { context: ., dockerfile: docker/Dockerfile.tablero }
    image: tablero-secop:latest
    environment: { PORT: "8501", API_URL: "${API_URL:-}" }
    ports: [ "8501:8501" ]
    restart: unless-stopped
